name: java-demo-app

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: bharatraj07/java-demo-app
  SONAR_PROJECT_NAME: java-demo-app

permissions:
  contents: read
  checks: write

jobs:
  build-test-app:
    runs-on: ubuntu-latest
    steps:
    - name: code-checkout
      uses: actions/checkout@v4

    - name: install-java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    
    - name: build-test-app
      run: mvn clean test

    - name: upload-test-results
      if: always()
      uses: dorny/test-reporter@v2
      with:
        name: maven test report
        path: target/surefire-reports/*.xml
        reporter: java-junit
    
    - name: package-application
      run: mvn package -DskipTests

    - name: sonarqube-code-analysis
      env:
        SONAR_TOKEN: ${{secrets.SONAR_KEY}}
        SONAR_URL: ${{secrets.SONAR_URL}}
      run: |
        mvn sonar:sonar \
        -Dsonar.projectKey=$SONAR_PROJECT_NAME \
        -Dsonar.host.url=$SONAR_URL \
        -Dsonar.token=$SONAR_TOKEN
  
    - name: qualitygate-analysis
      uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
      timeout-minutes: 10
      env:
          SONAR_URL: ${{secrets.SONAR_URL}}
          SONAR_TOKEN: ${{ secrets.SONAR_KEY }}
    
    - name: docker-login
      uses: docker/login-action@v3
      with:
        username: ${{vars.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}
    
    - name: docker-image-build
      run: docker build -t $DOCKER_IMAGE_NAME:latest .

    - name: docker-image-push
      run: docker push $DOCKER_IMAGE_NAME:latest
    
  deploy-app:
    needs: build-test-app
    runs-on: ubuntu-latest
    steps:
      - name: ssh-login
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.host}}
          username: ${{secrets.EC2_USERNAME}}
          password: ${{secrets.EC2_PASSWORD}}
          port: 22
          script: |
              docker pull ${{env.DOCKER_IMAGE_NAME}}:latest
              docker stop ${{env.DOCKER_CONTAINER_NAME}} || true
              docker rm ${{env.DOCKER_CONTAINER_NAME}} || true
              docker run -d -p 8081:8081 --name ${{env.DOCKER_CONTAINER_NAME}} ${{env.DOCKER_IMAGE_NAME}}:latest







