name: java-demo-app

on:
  workflow_dispatch

env:
  DOCKER_IMAGE_NAME: bharatraj07/java-demo-app
  SONAR_PROJECT_NAME: java-demo-app

jobs:
  buid-test-app:
    runs-on: ubuntu-latest
  steps:
    - name: code-checkout
      uses: actions/checkout@v7

    - name: install-java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    
    - name: build-test-app
      run: mvn clean test

    - name: upload-test-results
      if: always()
      uses: dorny/test-reporter@v2
      with:
        name: maven test report
        path: target/surefire-reports/*.xml
        reporter: java-junit
    
    - name: package-application
      run: mvn package -DskipTests

    - name: sonarqube-code-analysis
      env:
        SONAR_KEY: ${{secrets.SONAR_KEY}}
        SONAR_URL: ${{secrets.SONAR_URL}}
      run: |
        mvn sonar:sonar \
        -Dsonar.projectKey=$SONAR_PROJECT_NAME \
        -Dsonar.host.url=$SONAR_URL \
        -Dsonar.token=$SONAR_KEY
    
    - name: qualitygate-analysis
      uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
      timeout-minutes: 10
    
    - name: docker-login
      uses: docker/login-action@v3
      with:
        username: ${{vars.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}
    
    - name: docker-image-build
      run: docker buld -t $DOCKER_IMAGE_NAME:latest .
    
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: ssh-login
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.host}}
          username: ${{secrets.EC2_USERNAME}}
          password: ${{secrets.EC2_PASSWORD}}
          port: 22
          script: |
              docker rmi ${{env.DOCKER_IMAGE_NAME}}
              docker pull ${{env.DOCKER_IMAGE_NAME}}
              docker stop ${{env.DOCKER_CONTAINER_NAME}}
              docker rm ${{env.DOCKER_CONTAINER_NAME}}
              docker run -p 8081:8081 --name java-demo-app ${{env.DOCKER_IMAGE_NAME}}







